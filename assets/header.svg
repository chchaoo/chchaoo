<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Hi, I'm chchaoo. Foam-board RC planes and small, careful tools.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" class="dot"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="250" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .bg{fill:#f6f8fa;stroke:#d0d7de}
    .dot{fill:#d0d7de}
    .h{fill:#1f2328;font:700 46px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .s{fill:#59636e;font:19px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .z{fill:#59636e;font:17px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif}
    .acc{fill:#0969da}
    .wing{fill:#2f81f7;fill-opacity:.07;stroke:#2f81f7;stroke-width:2.2;stroke-linejoin:round}
    .hinge{stroke:#e5484d;stroke-width:2;stroke-dasharray:7 5;fill:none}
    .bay{fill:#d4a72c;stroke:#9a6700;stroke-width:1.2}
    .trail{stroke:#8c959f;stroke-width:1.6;stroke-dasharray:3 7;fill:none;stroke-linecap:round}
    @media (prefers-color-scheme:dark){
      .bg{fill:#161b22;stroke:#30363d}
      .dot{fill:#30363d}
      .h{fill:#e6edf3}.s,.z{fill:#9198a1}
      .acc{fill:#4493f8}
      .wing{fill:#4493f8;stroke:#4493f8;fill-opacity:.09}
      .trail{stroke:#6e7681}
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="248" rx="16"/>
  <rect x="1" y="1" width="1198" height="248" rx="16" fill="url(#dots)" mask="url(#dotmask)"/>

  <text class="h" x="56" y="104">Hi, I'm <tspan class="acc">chchaoo</tspan></text>
  <text class="s" x="58" y="148">I design foam-board RC planes and write small, careful tools.</text>
  <text class="z" x="58" y="184">做 KT 板航模，也写认真的小工具。</text>

  <!-- flight path -->
  <path class="trail" d="M640 214C760 226 845 204 912 180S976 150 992 142"/>

  <!-- the flying wing, top view -->
  <g transform="translate(1030 92) rotate(35) scale(0.72)">
    <path class="wing" d="M0 -6L-152 92L-152 118L-22 76L22 76L152 118L152 92Z"/>
    <path class="hinge" d="M-146 104L-26 64M146 104L26 64"/>
    <rect class="bay" x="-9" y="8" width="18" height="70" rx="3"/>
    <path class="wing" d="M-152 92L-160 94L-160 120L-152 118M152 92L160 94L160 120L152 118" style="fill:none"/>
  </g>
</svg>
