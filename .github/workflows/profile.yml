name: Profile

# Rebuilds the profile page from profile.json and public GitHub data:
#   - README.md (project cards follow the pinned repositories)
#   - the animated banner and the hand-drawn charts (scripts/build.mjs)
#   - the contribution snake (Platane/snk)
#
# The pictures are published to the `output` branch, which is replaced on
# every run, so they never pile up in the history of `main`. README.md is
# committed only when it actually changed.

on:
  schedule:
    # Every six hours, at 17 minutes past 00, 06, 12 and 18 UTC:
    # 5:17 and 11:17, am and pm, in Los Angeles (an hour earlier in winter).
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the page and the pictures
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish the pictures to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Redraw profile pictures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README.md if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the profile page" -- README.md
          git push
