name: Profile

# Redraws the images on the profile page every day:
#   - the hand-drawn charts (scripts/build.mjs): overview, star history, build log
#   - the contribution snake (Platane/snk)
# and refreshes the "Latest releases" list in README.md.
#
# The images are published to the `output` branch, which is replaced on
# every run, so they never pile up in the history of `main`.

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Draw the charts and refresh the release list
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Redraw profile images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the release list if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Release list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the latest releases" -- README.md
          git push
